name: Build & Release CipherGen

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - linux
          - android
          - ios

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust & Vitest Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Run Rust cryptographic core tests
        run: cargo test -p ciphergen-core --verbose

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Vitest unit tests
        run: npm test

      - name: Typecheck and build frontend
        run: npm run build

  build-windows:
    name: Build Windows (.exe NSIS)
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows NSIS installer (.exe)
        run: npx tauri build --bundles nsis

      - name: Upload Windows .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: CipherGen-Windows-NSIS
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux (.deb & .AppImage)
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Linux .deb and .AppImage
        run: npx tauri build --bundles deb,appimage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CipherGen-Linux-deb-AppImage
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  build-android:
    name: Build Android (.apk)
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK & NDK
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK_DIR/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Setup Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Tauri Android project
        run: npx tauri android init --ci

      - name: Build Android APK
        run: npx tauri android build --apk

      - name: Upload Android .apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: CipherGen-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  build-ios-unsigned:
    name: Build iOS (unsigned .ipa)
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust with iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend bundle
        run: npm run build

      - name: Initialize Tauri iOS project
        run: npx tauri ios init --ci

      - name: Disable code signing in generated Xcode project & build unsigned .ipa
        run: |
          PBXPROJ=$(find src-tauri/gen/apple -maxdepth 3 -name "project.pbxproj" | head -n 1)
          echo "Patching $PBXPROJ to disable code signing for unsigned IPA build..."
          python3 - "$PBXPROJ" <<'PYEOF'
          import sys, re
          path = sys.argv[1]
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()
          text = re.sub(r'DEVELOPMENT_TEAM\s*=\s*[^;]+;', 'DEVELOPMENT_TEAM = "";', text)
          text = re.sub(r'CODE_SIGN_STYLE\s*=\s*[^;]+;', 'CODE_SIGN_STYLE = Manual;', text)
          inject = (
              'buildSettings = {\n'
              '\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n'
              '\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n'
              '\t\t\t\tCODE_SIGN_IDENTITY = "";\n'
              '\t\t\t\tDEVELOPMENT_TEAM = "";'
          )
          text = text.replace('buildSettings = {', inject)
          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PYEOF

          # Run Tauri iOS build (archive succeeds unsigned; exportArchive may fail without Apple cert)
          npx tauri ios build --ci || true

          APP_PATH=$(find src-tauri/gen/apple/build -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No compiled .app bundle found under src-tauri/gen/apple/build"
            find src-tauri/gen/apple -maxdepth 5 || true
            exit 1
          fi
          echo "Found compiled unsigned .app: $APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          (cd build/ipa && zip -qry ../CipherGen-iOS-unsigned.ipa Payload)
          ls -lh build/CipherGen-iOS-unsigned.ipa

      - name: Upload unsigned iOS .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: CipherGen-iOS-Unsigned-IPA
          path: build/CipherGen-iOS-unsigned.ipa
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-android, build-ios-unsigned]
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten release files
        run: |
          mkdir -p dist-release
          find release-artifacts -type f \( -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.apk" -o -name "*.ipa" \) -exec cp {} dist-release/ \;
          ls -lh dist-release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
